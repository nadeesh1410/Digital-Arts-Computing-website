5px;font-weight:300;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);line-height:1.2;}.card .overlay .c-title{font-family:var(--serif);font-size:14px;font-style:italic;font-weight:400;color:var(--ink);margin-top:3px;line-height:1.3;}.card .c-medium{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);background:rgba(13,12,11,0.7);padding:3px 7px;opacity:0;transition:opacity 0.35s ease;}.card:hover .c-medium{opacity:1;}#status{padding:80px 24px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:0.1em;}#modal{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);display:none;overflow-y:auto;opacity:0;transition:opacity 0.3s ease;}#modal.open{display:block;opacity:1;}.modal-close{position:fixed;top:20px;right:26px;z-index:110;background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:22px;line-height:1;cursor:pointer;opacity:0.7;transition:opacity 0.2s ease, color 0.2s ease;}.modal-close:hover{opacity:1;color:var(--ink);}.modal-inner{max-width:960px;margin:0 auto;padding:68px 28px 100px;}.media-frame{position:relative;width:100%;aspect-ratio:16 / 9;background:#0a0908;margin-bottom:40px;overflow:hidden;}.media-frame iframe,.media-frame img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;}.media-frame::after{content:"";position:absolute;inset:0;border:1px solid var(--border);pointer-events:none;}.m-title{font-family:var(--serif);font-size:32px;font-weight:400;font-style:italic;letter-spacing:-0.01em;line-height:1.15;color:var(--ink);}.m-name{font-family:var(--mono);font-size:11px;font-weight:300;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-top:10px;}.m-medium{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:4px 10px;}.m-desc{margin-top:28px;max-width:60ch;font-family:var(--serif);font-size:16px;line-height:1.72;color:rgba(240,236,228,0.8);font-weight:400;}.m-link{display:inline-block;margin-top:32px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(200,184,154,0.35);padding-bottom:2px;transition:opacity 0.2s ease;}.m-link:hover{opacity:0.6;}#about-page{display:none;max-width:680px;margin:0 auto;padding:72px 28px 100px;position:relative;z-index:1;}#about-page.visible{display:block;}@media (max-width:600px){nav{gap:4px;}nav button{font-size:10px;padding:5px 8px;}.modal-inner{padding-top:60px;}.m-title{font-size:26px;}}
